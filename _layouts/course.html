---
layout: default
---
{% assign t = site.data.ui[page.lang] %}
<article class="course">
  <p><a class="back-link" href="{% include relurl.html to=page.teaching_url %}">{{ t.back_to_teaching }}</a></p>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="course-summary">{{ page.summary }}</p>{% endif %}

  {{ content }}
</article>
